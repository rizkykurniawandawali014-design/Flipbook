    <style>
        :root {
            --primary: #10B981; 
            --secondary: #3B82F6; 
            --bg-color: #F0FDF4; 
            --text-main: #1F2937;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e7eb;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; 
            touch-action: none; 
        }

        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }

        #book-container {
            perspective: 1500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 1.5rem;
            background: white;
            overflow: hidden;
            position: relative;
        }

        .book-binding {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.05) 20%, transparent 100%);
            z-index: 50;
            border-left: 5px solid #059669; 
            pointer-events: none;
        }

        /* Transisi Geser Halus */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            transform: translateX(100%) scale(0.95);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            visibility: hidden;
            overflow: hidden;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            visibility: visible;
            z-index: 10;
        }

        .scroll-area::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        /* Animasi */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .animate-wiggle {
            animation: wiggle 1.5s ease-in-out infinite;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .video-banner {
            animation: pulse-shadow 2s infinite;
            transition: transform 0.3s ease;
        }
        .video-banner:hover, .video-banner:active {
            transform: scale(0.98);
        }

        .audio-player {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-top: 1px solid #e5e7eb;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

            {

                subtitle: "Tonton & Pelajari Lebih Lanjut",

                `,
                audioText: "Untuk memahami lebih dalam, silahkan klik tombol banner video edukasi di layar untuk menonton tayangan YouTube. Terima kasih telah membaca buku saku ini. Mari wujudkan generasi remaja sekolah yang sehat dan cerdas!"
            }
        ];

        let currentPageIndex = 0;
        let isAnimating = false;
        const totalPages = bookData.length;

        const pagesContainer = document.getElementById('pages-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const pageIndicator = document.getElementById('page-indicator');
        
        function renderAllPages() {
            pagesContainer.innerHTML = ''; 
            bookData.forEach((pageData, index) => {
                const pageEl = document.createElement('div');
                pageEl.className = `page absolute w-full h-full ${index === 0 ? 'active' : 'prev'}`;
                pageEl.id = `page-${index}`;
                
                if (pageData.type === 'cover') {
                    // Tata letak cover diubah menjadi top-aligned (justify-start) agar tidak pernah memotong tombol
                    pageEl.classList.add(pageData.bgColor);
                    pageEl.innerHTML = `
                        <div class="flex flex-col items-center justify-start h-full text-center space-y-6 ${pageData.textColor} px-6 pt-10 pb-40 overflow-y-auto scroll-area">
                            <div class="w-28 h-28 sm:w-32 sm:h-32 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm border-4 border-white/30 animate-float shadow-lg flex-shrink-0 mt-4">
                                <span class="text-5xl sm:text-6xl">${pageData.icon}</span>
                            </div>
                            <div class="w-full">
                                <p class="text-[10px] sm:text-xs font-bold tracking-wider uppercase mb-3 opacity-90 border-b border-white/40 pb-2 inline-block">Buku Saku Digital</p>
                                <h1 class="text-lg sm:text-xl font-extrabold leading-tight mb-4 drop-shadow-md px-2">${pageData.title}</h1>
                                <div class="bg-black/10 p-3 mx-2 rounded-xl backdrop-blur-sm">
                                    <h2 class="text-sm sm:text-base font-semibold leading-snug">${pageData.subtitle}</h2>
                                </div>
                            </div>
                            <div class="text-[11px] sm:text-xs animate-bounce opacity-80 font-semibold mt-4 flex-shrink-0">
                                Geser atau Tekan Next <br> <i class="fas fa-chevron-down mt-1"></i>
                            </div>
                        </div>
                    `;
                } else {
                    pageEl.innerHTML = `
                        <div class="max-w-md mx-auto h-full flex flex-col px-6">
                            <div class="border-b-2 border-emerald-100 pb-3 mb-5 pt-10 flex-shrink-0">
                                <span class="text-[10px] sm:text-xs font-bold text-emerald-500 tracking-wider uppercase bg-emerald-50 px-2 py-1 rounded">Bab ${index}</span>
                                <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mt-2 leading-tight">${pageData.title}</h2>
                                <h3 class="text-xs sm:text-sm text-gray-500 font-medium">${pageData.subtitle}</h3>
                            </div>
                            <div class="flex-grow overflow-y-auto scroll-area pr-2 pb-40">
                                ${pageData.content}
                            </div>
                        </div>
                    `;
                }
                pagesContainer.appendChild(pageEl);
            });
        }

        function updatePaginationUI() {
            pageIndicator.innerText = `${currentPageIndex + 1} / ${totalPages}`;
            btnPrev.disabled = currentPageIndex === 0;
            
            if (currentPageIndex === totalPages - 1) {
                btnNext.innerHTML = 'Selesai <i class="fas fa-check ml-1"></i>';
                btnNext.classList.replace('bg-emerald-500', 'bg-blue-500');
                btnNext.classList.replace('hover:bg-emerald-600', 'hover:bg-blue-600');
            } else {
                btnNext.innerHTML = 'Next <i class="fas fa-chevron-right ml-1"></i>';
                btnNext.classList.replace('bg-blue-500', 'bg-emerald-500');
                btnNext.classList.replace('hover:bg-blue-600', 'hover:bg-emerald-600');
            }
        }

        function turnPage(direction) {
            if (isAnimating) return;
            const newIndex = direction === 'next' ? currentPageIndex + 1 : currentPageIndex - 1;
            if (newIndex < 0 || newIndex >= totalPages) return;

            isAnimating = true;
            stopAudio(); 

            const currentPage = document.getElementById(`page-${currentPageIndex}`);
            const nextPage = document.getElementById(`page-${newIndex}`);

            if (direction === 'next') {
                currentPage.style.transform = 'translateX(-100%) scale(0.95)';
                currentPage.style.opacity = '0';
                nextPage.style.transform = 'translateX(100%) scale(0.95)';
                nextPage.style.opacity = '0';
                nextPage.style.visibility = 'visible';
                
                void nextPage.offsetWidth;

                nextPage.style.transform = 'translateX(0) scale(1)';
                nextPage.style.opacity = '1';
                nextPage.style.zIndex = '10';
                currentPage.style.zIndex = '5';
            } else {
                currentPage.style.transform = 'translateX(100%) scale(0.95)';
                currentPage.style.opacity = '0';
                nextPage.style.transform = 'translateX(-100%) scale(0.95)';
                nextPage.style.opacity = '0';
                nextPage.style.visibility = 'visible';
                
                void nextPage.offsetWidth;

                nextPage.style.transform = 'translateX(0) scale(1)';
                nextPage.style.opacity = '1';
                nextPage.style.zIndex = '10';
                currentPage.style.zIndex = '5';
            }

            setTimeout(() => {
                currentPage.classList.remove('active');
                currentPage.style.visibility = 'hidden';
                nextPage.classList.add('active');
                currentPageIndex = newIndex;
                updatePaginationUI();
                isAnimating = false;
                
                const scrollArea = nextPage.querySelector('.scroll-area');
                if (scrollArea) scrollArea.scrollTop = 0;
                
                document.getElementById('audio-status').innerText = "Putar Suara Penjelasan";
                document.getElementById('audio-progress').style.width = "0%";
            }, 500);
        }

        let isPlaying = false;
        let htmlAudioObject = null; // Pemutar MP3
        let synth = window.speechSynthesis; // Pemutar TTS
        let utterance = null;
        let progressInterval;

        const btnPlayAudio = document.getElementById('btn-play-audio');
        const iconAudio = document.getElementById('icon-audio');
        const audioStatus = document.getElementById('audio-status');
        const audioProgress = document.getElementById('audio-progress');

        function playAudio() {
            if (isPlaying) {
                stopAudio();
                return;
            }

            const currentMp3Link = sumberSuaraMP3[currentPageIndex];
            const textToSpeak = bookData[currentPageIndex].audioText;
            
            if (!textToSpeak && !currentMp3Link) return;

            isPlaying = true;
            uiSetPlaying();

            // Skenario 1: Jika user sudah menaruh link MP3
            if (currentMp3Link && currentMp3Link.trim() !== "") {
                htmlAudioObject = new Audio(currentMp3Link);
                htmlAudioObject.onplay = () => {
                    clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        if (htmlAudioObject.duration) {
                            const progress = (htmlAudioObject.currentTime / htmlAudioObject.duration) * 100;
                            audioProgress.style.width = `${progress}%`;
                        }
                    }, 100);
                };
                htmlAudioObject.onended = stopAudio;
                htmlAudioObject.onerror = () => {
                    stopAudio();
                    audioStatus.innerText = "Gagal memutar MP3. Cek koneksi.";
                };
                htmlAudioObject.play().catch(e => {
                    console.error(e);
                    stopAudio();
                });
            } 
            // Skenario 2: Menggunakan AI Voice Bawaan (Paling Premium yg ada di HP)
            else {
                synth.cancel(); // Bersihkan antrean
                utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9; // Diperlambat sedikit agar natural
                utterance.pitch = 1.0; 

                // Cari suara terbaik
                let voices = synth.getVoices();
                let idVoices = voices.filter(v => v.lang === 'id-ID' || v.lang === 'id_ID');
                
                if(idVoices.length > 0) {
                    // Prioritaskan suara buatan Google atau Natural
                    let bestVoice = idVoices.find(v => v.name.includes('Google') || v.name.includes('Premium'));
                    utterance.voice = bestVoice || idVoices[0];
                }

                utterance.onstart = () => {
                    // Simulasi progress bar untuk TTS
                    const wordCount = textToSpeak.split(' ').length;
                    const estimatedTimeMs = (wordCount / 2.5) * 1000; 
                    let progress = 0;
                    const step = 100 / (estimatedTimeMs / 100);

                    clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        progress += step;
                        if (progress >= 100) progress = 100;
                        audioProgress.style.width = `${progress}%`;
                    }, 100);
                };
                
                utterance.onend = stopAudio;
                utterance.onerror = (e) => {
                    console.error(e);
                    stopAudio();
                    audioStatus.innerText = "Sistem audio browser terblokir.";
                };

                synth.speak(utterance);
            }
        }

        function uiSetPlaying() {
            iconAudio.classList.replace('fa-play', 'fa-pause');
            btnPlayAudio.classList.replace('bg-emerald-500', 'bg-red-500');
            btnPlayAudio.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
            audioStatus.innerText = "Sedang Memutar...";
        }

        function stopAudio() {
            isPlaying = false;
            
            // Hentikan MP3
            if (htmlAudioObject) {
                htmlAudioObject.pause();
                htmlAudioObject.currentTime = 0;
            }
            
            // Hentikan TTS
            if (synth) {
                synth.cancel();
            }

            clearInterval(progressInterval);
            if(iconAudio) iconAudio.classList.replace('fa-pause', 'fa-play');
            if(btnPlayAudio) {
                btnPlayAudio.classList.replace('bg-red-500', 'bg-emerald-500');
                btnPlayAudio.classList.replace('hover:bg-red-600', 'hover:bg-emerald-600');
            }
            if(audioStatus) audioStatus.innerText = "Putar Suara Penjelasan";
            if(audioProgress) audioProgress.style.width = "0%";
        }

        // Pancing daftar suara browser saat dimuat
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
        }

        btnNext.addEventListener('click', () => {
            if(currentPageIndex === totalPages - 1) {
                turnPage('next'); 
                currentPageIndex = 0;
                renderAllPages(); 
                updatePaginationUI();
            } else {
                turnPage('next');
            }
        });
        
        btnPrev.addEventListener('click', () => turnPage('prev'));
        btnPlayAudio.addEventListener('click', playAudio);

        // Dukungan Swipe HP
        let touchstartX = 0;
        let touchendX = 0;
        document.getElementById('book-container').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        document.getElementById('book-container').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (Math.abs(touchendX - touchstartX) > 50) {
                touchendX < touchstartX ? turnPage('next') : turnPage('prev');
            }
        }, {passive: true});

        window.onload = () => {
            renderAllPages();
            updatePaginationUI();
            synth.getVoices(); // init voice
        };
    </script>
</body>
